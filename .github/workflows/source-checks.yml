name: Source and CLI checks
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install . build ruff
      - run: python -m compileall -q src tests
      - run: ruff check src --select E9,F63,F7,F82
      - run: python -c "import json; from pathlib import Path; [json.loads(path.read_text(encoding='utf-8')) for path in Path('configs').glob('*.json')]"
      - run: python -m graphfec --help
      - run: python -m build
